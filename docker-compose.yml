services:

  # ── MySQL Database ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ragdb_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB container ─────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:1.5.9    # pinned to match the chromadb client in requirements.txt
    container_name: ragdb_chroma
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data           # Chroma 1.x persists to /data

  # ── FastAPI Backend ────────────────────────────────────────────
  backend:
    build: .                        # ← root folder (not ./backend)
    container_name: ragdb_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside Docker the services are reached by their service names,
      # whatever the .env file says (so .env can hold your local values).
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    volumes:
      - ./documents:/app/documents
      - hf_cache:/root/.cache/huggingface   # keeps the embedding model between restarts
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_started

  # ── React Frontend ─────────────────────────────────────────────
  frontend:
    build: ./Frontend               # ← capital F to match your folder name
    container_name: ragdb_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  chroma_data:
  hf_cache:
